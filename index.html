<style>
/* Single dark theme by choice: black page, neon gold, one lit object.
   Layout: the canvas is a backdrop layer across the two content columns,
   ball in the left cell, text in the right. Opening a panel flies the camera
   into the ball and the content panel reads against the lit interior. */
:root {
  --bg: #0C0E12;
  --surface: #161A20;
  --surface-2: #1D222A;
  --fg: #F2F4F6;
  --muted: #929BA5;
  --line: #2D333C;
  --gold: #FFC94A;
  --gold-dim: #8A6F2A;
  --gold-glow: rgba(255, 201, 74, 0.45);
  --font-display: 'Anton', 'Arial Narrow', Impact, sans-serif;
  --font-body: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html { background: #3A0509; }
body { background: transparent; }

/* interactive backdrop: a dot grid on deep red that lights up gold around
   the pointer and ripples outward from each click */
#bgfx {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  pointer-events: none;
}

body {
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 20px;
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
}

.masthead {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px 20px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
  margin-bottom: 20px;
}
.wordmark {
  font-family: var(--font-display);
  font-size: clamp(22px, 3.4vw, 30px);
  letter-spacing: 0.02em;
  text-transform: uppercase;
  line-height: 1;
  color: var(--fg);
}
.masthead-meta {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}
.masthead-meta a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--line); }
.masthead-meta a:hover { color: var(--gold); border-color: var(--gold); }

/* The stage fills the rest of the viewport. The ball sits dead centre, the
   section bar floats over its left edge, and the content panel only appears
   inside the ball once a panel has been opened. */
.stage {
  position: relative;
  flex: 1 1 auto;
  min-height: 420px;
}

/* ---- ball layer ---- */
.ball-layer {
  position: absolute;
  inset: 0;
  z-index: 0;
  border-radius: 6px;
  overflow: hidden;
}
#ball { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#ball.grabbing { cursor: grabbing; }
#ball.over-panel { cursor: pointer; }

/* dark gradient that deepens the interior once you are inside */
.vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity 500ms ease;
  background:
    radial-gradient(120% 90% at 50% 45%, rgba(255, 201, 74, 0.10) 0%, rgba(255, 201, 74, 0) 46%),
    radial-gradient(100% 100% at 50% 50%, rgba(0, 0, 0, 0) 38%, rgba(0, 0, 0, 0.72) 100%);
}
body.is-inside .vignette { opacity: 1; }

.card-kicker {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--gold);
  text-shadow: 0 0 14px var(--gold-glow);
  margin-bottom: 10px;
}
/* The content panel, centred over the ball's lit interior. All four insets
   plus auto margins centre it; it is hidden until the camera is inside. */
.card {
  position: absolute;
  z-index: 2;
  inset: 20px 84px 40px;
  margin: auto;
  max-width: 640px;
  height: fit-content;
  max-height: calc(100% - 60px);
  overflow-y: auto;
  overscroll-behavior: contain;
  background: rgba(16, 19, 24, 0.84);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  border: 1px dashed var(--gold-dim);
  border-radius: 10px;
  padding: 24px 22px 22px;
  box-shadow: 0 0 0 1px rgba(255, 201, 74, 0.07), 0 26px 70px rgba(0, 0, 0, 0.8);
  opacity: 0;
  visibility: hidden;
  transform: scale(0.96);
  transition: opacity 280ms ease, transform 280ms ease, visibility 0s linear 280ms;
}
.card.shown {
  opacity: 1;
  visibility: visible;
  transform: none;
  transition: opacity 280ms ease, transform 280ms ease, visibility 0s;
}
.card:focus { outline: none; }
.card h2 {
  font-family: var(--font-display);
  font-size: clamp(25px, 3.3vw, 34px);
  line-height: 1;
  letter-spacing: 0.01em;
  text-transform: uppercase;
  margin: 0 0 14px;
  text-wrap: balance;
}
.card p { margin: 0 0 12px; max-width: 58ch; color: var(--fg); }
.card p:last-child { margin-bottom: 0; }

.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }

/* X to leave the ball */
.closer {
  flex: none;
  appearance: none;
  background: rgba(255, 201, 74, 0.07);
  border: 1px solid var(--gold-dim);
  border-radius: 8px;
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  cursor: pointer;
  padding: 0;
  color: var(--gold);
}
.closer svg { display: block; }
.closer:hover { background: rgba(255, 201, 74, 0.18); box-shadow: 0 0 16px var(--gold-glow); }
.closer:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.entries { display: grid; gap: 14px; }
.entry { display: grid; gap: 3px; padding-left: 14px; border-left: 2px solid var(--line); }
.entry.lead { border-left-color: var(--gold); box-shadow: -2px 0 12px -4px var(--gold-glow); }
.entry-title { font-weight: 700; font-size: 15px; }
.entry-meta {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.05em;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.entry-body { font-size: 14.5px; color: var(--muted); max-width: 62ch; }
.repo-link { color: var(--gold); text-decoration: none; border-bottom: 1px solid var(--gold-dim); }
.repo-link:hover { text-shadow: 0 0 12px var(--gold-glow); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.chip {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 4px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  color: var(--muted);
}

.contact-list { display: grid; gap: 10px; }
.contact-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.contact-label {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  width: 72px;
  flex: none;
}
.contact-value { font-family: var(--font-mono); font-size: 13.5px; word-break: break-all; user-select: all; }
.contact-value a { color: var(--fg); text-decoration-color: var(--line); }
.contact-value a:hover { color: var(--gold); }
.copy-btn {
  appearance: none;
  background: none;
  border: 1px solid var(--line);
  border-radius: 4px;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 3px 7px;
  cursor: pointer;
}
.copy-btn:hover { color: var(--gold); border-color: var(--gold); }

/* ---- section bar: icons only until expanded, floats over the ball ---- */
.rail {
  position: absolute;
  z-index: 3;
  left: 0;
  top: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
  width: 56px;
  padding: 6px;
  border-radius: 12px;
  background: rgba(16, 19, 24, 0.78);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  border: 1px solid var(--line);
  overflow: hidden;
  transition: width 260ms ease, box-shadow 260ms ease;
}
.rail.expanded { width: 196px; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.6); }
.rail-toggle {
  appearance: none;
  background: none;
  border: none;
  border-radius: 7px;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  text-align: left;
  padding: 0 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  min-height: 40px;
  white-space: nowrap;
}
.rail-toggle:hover { color: var(--gold); background: var(--surface-2); }
.rail-toggle:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.rail-toggle svg { flex: none; display: block; transition: transform 260ms ease; }
.rail.expanded .rail-toggle svg { transform: rotate(180deg); }
.tabs { display: flex; flex-direction: column; gap: 2px; }
.rail-sep { height: 1px; background: var(--line); margin: 2px 4px 4px; }
.tab {
  appearance: none;
  background: none;
  border: none;
  border-radius: 7px;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 600;
  text-align: left;
  padding: 9px 13px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  min-height: 44px;
  white-space: nowrap;
}
.tab-label, .rail-toggle span { opacity: 0; transition: opacity 180ms ease; }
.rail.expanded .tab-label, .rail.expanded .rail-toggle span { opacity: 1; transition-delay: 80ms; }
.tab:hover { background: var(--surface-2); }
.tab .pent { flex: none; display: block; }
.tab .pent path { fill: none; stroke: #6A727B; stroke-width: 10; }
.tab:hover .pent path { stroke: var(--gold); }
.tab[aria-selected="true"] { background: rgba(255, 201, 74, 0.1); color: var(--gold); }
.tab[aria-selected="true"] .pent path { fill: var(--gold); stroke: var(--gold); filter: drop-shadow(0 0 5px var(--gold)); }
.tab:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* hint sits under the ball */
.hintbar {
  position: absolute;
  z-index: 1;
  left: 0;
  right: 0;
  bottom: 10px;
  margin: 0;
  text-align: center;
  pointer-events: none;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
}

.foot {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

@media (max-width: 719px) {
  /* leave the collapsed bar uncovered on the left */
  .card { inset: 12px 0 12px 66px; max-height: calc(100% - 24px); padding: 20px 16px 18px; }
  .hintbar { left: 56px; }
  body.is-inside .hintbar { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';
  var cv = document.getElementById('bgfx');
  var ctx = cv.getContext('2d');
  var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var GAP = 30, REACH = 190;
  var w = 0, h = 0, dpr = 1, dots = [];
  var ptr = { x: -9999, y: -9999 }, eased = { x: -9999, y: -9999 };
  var ripples = [];

  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dots = [];
    for (var y = GAP / 2; y < h + GAP; y += GAP) {
      var odd = Math.round(y / GAP) % 2;
      for (var x = odd ? GAP : GAP / 2; x < w + GAP; x += GAP) dots.push(x, y);
    }
    if (still) draw(0);
  }

  function draw(t) {
    var g = ctx.createRadialGradient(w * 0.5, h * 0.45, 0, w * 0.5, h * 0.45, Math.max(w, h) * 0.75);
    g.addColorStop(0, '#8E1019');
    g.addColorStop(0.55, '#5A0A10');
    g.addColorStop(1, '#2A0407');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    // soft glow that trails the pointer
    if (eased.x > -999) {
      var glow = ctx.createRadialGradient(eased.x, eased.y, 0, eased.x, eased.y, REACH * 1.6);
      glow.addColorStop(0, 'rgba(255, 140, 60, 0.22)');
      glow.addColorStop(1, 'rgba(255, 140, 60, 0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, w, h);
    }

    var wave = still ? 0 : t / 1000;
    for (var i = 0; i < dots.length; i += 2) {
      var x = dots[i], y = dots[i + 1];
      var k = 0;
      var dx = x - eased.x, dy = y - eased.y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < REACH) k = 1 - d / REACH;
      for (var r = 0; r < ripples.length; r++) {
        var rp = ripples[r];
        var rd = Math.abs(Math.hypot(x - rp.x, y - rp.y) - rp.r);
        if (rd < 40) k = Math.max(k, (1 - rd / 40) * rp.a);
      }
      // dots near the pointer are pushed gently outward
      var push = k * 7;
      var px = d > 0 ? x + dx / d * push : x, py = d > 0 ? y + dy / d * push : y;
      var idle = 0.5 + 0.5 * Math.sin(wave * 1.2 + x * 0.012 + y * 0.018);
      var rad = 1.1 + idle * 0.5 + k * 2.4;
      ctx.fillStyle = k > 0.02
        ? 'rgba(255, ' + Math.round(110 + 91 * k) + ', ' + Math.round(90 - 16 * k) + ', ' + (0.3 + 0.7 * k) + ')'
        : 'rgba(255, 110, 100, ' + (0.16 + idle * 0.12) + ')';
      ctx.beginPath();
      ctx.arc(px, py, rad, 0, 6.2832);
      ctx.fill();
    }
  }

  var last = 0;
  function loop(t) {
    var dt = last ? Math.min((t - last) / 1000, 0.1) : 0;
    last = t;
    eased.x += (ptr.x - eased.x) * Math.min(1, dt * 9);
    eased.y += (ptr.y - eased.y) * Math.min(1, dt * 9);
    for (var i = ripples.length - 1; i >= 0; i--) {
      ripples[i].r += dt * 520;
      ripples[i].a -= dt * 0.8;
      if (ripples[i].a <= 0) ripples.splice(i, 1);
    }
    draw(t);
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', size);
  if (!still) {
    window.addEventListener('pointermove', function (e) {
      if (eased.x < -999) { eased.x = e.clientX; eased.y = e.clientY; }
      ptr.x = e.clientX; ptr.y = e.clientY;
    }, { passive: true });
    window.addEventListener('pointerdown', function (e) {
      ripples.push({ x: e.clientX, y: e.clientY, r: 0, a: 1 });
    }, { passive: true });
    document.documentElement.addEventListener('pointerleave', function () { ptr.x = ptr.y = -9999; eased.x = eased.y = -9999; });
  }
  size();
  if (!still) requestAnimationFrame(loop);
})();
</script>

        .filter(function (o) { return o.j !== i; })
        .sort(function (a, b) { return a.d - b.d; })

    var chosen = pickAntipodalSix(solid.pentagons);
    var tearSet = {};

    solid.pentagons.forEach(function (p, i) {

      appendPoly(pentOut, p, INSET, 1);
      appendPoly(linerArr, p, 0, LINER);

      new THREE.MeshStandardMaterial({ color: 0xf2f2ee, roughness: 0.5, metalness: 0.02 })));
    ballGroup.add(new THREE.Mesh(geomFrom(pentOut),
      new THREE.MeshStandardMaterial({ color: 0x0C0F12, roughness: 0.56, metalness: 0.03 })));

  function pickAntipodalSix(pentagons) {
    var axes = pentagons.map(function (p, i) { return { i: i, n: centroidOf(p).normalize() }; });
    var pairs = [], used = {};
    axes.forEach(function (a) {
      if (used[a.i]) return;
      var opp = null, best = 2;
      axes.forEach(function (b) {
        if (b.i === a.i || used[b.i]) return;
        var d = a.n.dot(b.n);
        if (d < best) { best = d; opp = b; }
      });
      if (opp) { used[a.i] = used[opp.i] = true; pairs.push([a, opp]); }
    });
    var picked = [pairs[0]];
    while (picked.length < 3) {
      var bestPair = null, bestScore = -Infinity;
      pairs.forEach(function (pr) {
        if (picked.indexOf(pr) !== -1) return;
        var s = 0;
        picked.forEach(function (cp) { s -= Math.abs(pr[0].n.dot(cp[0].n)); });
        if (s > bestScore) { bestScore = s; bestPair = pr; }
      });
      picked.push(bestPair);
    }
    return [picked[0][0].i, picked[1][0].i, picked[2][0].i,
            picked[0][1].i, picked[1][1].i, picked[2][1].i];
  }

  function makePanel(pts, section) {
    var ordered = orderOutward(pts);
    var centre = centroidOf(ordered);
    var normal = centre.clone().normalize();

    // hinge on the lowest edge, so the flap falls open downward
    var hi = 0, lowest = Infinity;
    for (var i = 0; i < 5; i++) {
      var m = ordered[i].clone().add(ordered[(i + 1) % 5]).multiplyScalar(0.5);
      if (m.y < lowest) { lowest = m.y; hi = i; }

    var yA = new THREE.Vector3().crossVectors(zA, xA).normalize();
    if (yA.dot(centre.clone().sub(origin)) < 0) {

    local.forEach(function (p) { c2.x += p.x / 5; c2.y += p.y / 5; });

    // both blended additively so they read as emitted rather than painted
    function ringLine(scale, z, opacity) {
      var pts = ring.map(function (p) {
        var q = p.clone().sub(c2).multiplyScalar(scale).add(c2);

          blending: THREE.AdditiveBlending, depthWrite: false

        blending: THREE.AdditiveBlending, depthWrite: false

    mesh.add(label);

    // Seen from inside, a panel's own material lights quite differently from
    // the liner and shows up as a pale patch on the wall. This backing plate
    // gives it the liner's face, rendered only from the inside.
    var backing = new THREE.Mesh(
      new THREE.ShapeGeometry(new THREE.Shape(ring)),
      new THREE.MeshStandardMaterial({
        color: 0x02030A, roughness: 0.96, metalness: 0,
        emissive: new THREE.Color(0x03040A),
        envMapIntensity: 0,
        side: THREE.BackSide
      })
    );
    backing.position.z = -depth - 0.002;
    mesh.add(backing);

    var base = new THREE.Object3D();
    base.position.copy(origin);
    base.quaternion.setFromRotationMatrix(basis);
    var pivot = new THREE.Object3D();
    base.add(pivot);
    pivot.add(mesh);
    ballGroup.add(base);

    // Rotating the ball by this quaternion brings the panel square to the
    // camera — normal toward the viewer AND the hinge edge level, so the
    // printed name sits upright rather than at whatever roll the hinge had.
    var alignQuat = new THREE.Quaternion().setFromRotationMatrix(basis).invert();

    return {
      section: section, mesh: mesh, pivot: pivot, mat: mat,
      normal: normal, alignQuat: alignQuat, liftTween: null

  /* ------------------------------------------------------------------ *

  // The ball always sits in the middle of the stage.
  function frameIdle() {

    var d = Math.sqrt(Math.pow(focal * R / rPx, 2) + R * R);

  var lightTween = null;
  function lightsTo(set, dur) {
    if (lightTween) lightTween.cancel();
    var from = {
      key: key.intensity, fill: fill.intensity, ambient: ambient.intensity,
      bulb: bulb.intensity, reading: readingLight.intensity
    };
    lightTween = tween({
      dur: dur, ease: ease.inOutQuad,
      step: function (k) {
        key.intensity = from.key + (set.key - from.key) * k;
        fill.intensity = from.fill + (set.fill - from.fill) * k;
        ambient.intensity = from.ambient + (set.ambient - from.ambient) * k;
        bulb.intensity = from.bulb + (set.bulb - from.bulb) * k;
        readingLight.intensity = from.reading + (set.reading - from.reading) * k;
      },
      done: function () { lightTween = null; }
    });
  }

  function flyTo(target, dur, easing, done) {
    if (camTween) camTween.cancel();
    var from = camera.position.clone();
    camTween = tween({
      dur: dur, ease: easing,
      step: function (k) { camera.position.lerpVectors(from, target, k); },
      done: function () { camTween = null; if (done) done(); }
    });
  }

  // Each step re-checks that its panel is still the one being opened, so a
  // quick second click never lands a stale card.
  function enter(panel) {
    if (current !== panel) return;
    setStatus('Opening ' + panel.section.label.toLowerCase());
    swing(panel, OPEN_ANGLE, 300);
    after(150, function () {
      if (current !== panel) return;
      inside = true;
      document.body.classList.add('is-inside');
      setHint('Inside the ball — pick another section, or press Esc');
      lightsTo(INSIDE_LIGHT, 560);
      flyTo(INSIDE.clone(), 620, ease.inCubic, function () {
        if (current !== panel) return;
        // once through, the flap is behind the viewer and only catches
        // reflections across the interior, so it is taken out of the frame
        panel.mesh.visible = false;
        setStatus('Inside · ' + panel.section.label);
        renderCard(panel.section);
        showCard();
        requestRender();
      });
    });
  }

  function exit(panel, done) {
    inside = false;
    panel.mesh.visible = true;
    document.body.classList.remove('is-inside');
    frameIdle();
    lightsTo(OUTSIDE_LIGHT, 420);
    flyTo(idleCam.clone(), 460, ease.inOutCubic, done);
    after(200, function () { swing(panel, 0, 280); });
  }

  var openId = null;

  function openSection(id) {
    var section = SECTIONS.filter(function (s) { return s.id === id; })[0];
    if (!section || openId === id) return;
    openId = id;
    markTab(id);
    hideCard();
    if (narrow.matches) setRail(false);

    // no 3D: show the content straight away
    if (!renderer) { renderCard(section); showCard(); return; }

    var panel = panels.filter(function (p) { return p.section.id === id; })[0];
    if (current) {
      var prev = current;
      current = panel;
      exit(prev);
      after(240, function () {
        if (current === panel) rotateTo(panel, function () { enter(panel); });
      });
    } else {
      current = panel;
      rotateTo(panel, function () { enter(panel); });
    }
  }

  function closeSection() {
    if (!openId) return;
    var prevId = openId;
    openId = null;
    hideCard();
    markTab(null);
    if (current) {
      var prev = current;
      current = null;
      exit(prev);
    }
    setStatus('Outside the ball');
    setHint('Drag to spin · click a gold panel');
    var btn = document.querySelector('.tab[data-id="' + prevId + '"]');
    if (btn) btn.focus();
  }

  /* ------------------------------------------------------------------ *
   * 8. Pointer
   * ------------------------------------------------------------------ */
  var ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  var dragging = false, moved = 0, lastX = 0, lastY = 0, lastMove = null;

  function pickAt(cx, cy) {
    if (inside) return null;
    var r = canvas.getBoundingClientRect();
    ndc.x = ((cx - r.left) / r.width) * 2 - 1;
    ndc.y = -((cy - r.top) / r.height) * 2 + 1;
    ray.setFromCamera(ndc, camera);
    var hits = ray.intersectObjects(panels.map(function (p) { return p.mesh; }), false);
    if (!hits.length) return null;
    return panels.filter(function (p) { return p.mesh === hits[0].object; })[0] || null;
  }

  function setHover(panel) {
    if (hovered === panel) return;
    if (hovered) {
      hovered.mat.emissiveIntensity = 0.05;
      if (hovered !== current) swing(hovered, 0, 90);
    }
    hovered = panel;
    if (hovered) {
      hovered.mat.emissiveIntensity = 0.3;
      if (hovered !== current) swing(hovered, 0.1, 120);
    }
    canvas.classList.toggle('over-panel', !!panel);
    if (!inside) setHint(panel ? panel.section.label + ' — click to open' : 'Drag to spin · click a gold panel');
    requestRender();
  }

  function doHoverPick() { if (!dragging) setHover(lastMove ? pickAt(lastMove[0], lastMove[1]) : null); }

  canvas.addEventListener('pointerdown', function (e) {
    if (inside) return;
    dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY;
    canvas.classList.add('grabbing');
    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener('pointermove', function (e) {
    if (inside) return;
    if (dragging) {
      var dx = e.clientX - lastX, dy = e.clientY - lastY;
      moved += Math.abs(dx) + Math.abs(dy);
      lastX = e.clientX; lastY = e.clientY;
      if (ballTween) { ballTween.cancel(); ballTween = null; }
      ballGroup.quaternion.premultiply(
        new THREE.Quaternion().setFromEuler(new THREE.Euler(dy * 0.006, dx * 0.006, 0, 'XYZ')));
      requestRender();
    } else {
      lastMove = [e.clientX, e.clientY];
      pendingPick = true;
      requestRender();
    }
  });

  canvas.addEventListener('pointerup', function (e) {
    if (!dragging) return;
    dragging = false;
    canvas.classList.remove('grabbing');
    if (moved < 6) {
      var hit = pickAt(e.clientX, e.clientY);
      if (hit) openSection(hit.section.id);
    }
  });
  canvas.addEventListener('pointercancel', function () { dragging = false; canvas.classList.remove('grabbing'); });
  canvas.addEventListener('pointerleave', function () { lastMove = null; setHover(null); });

  /* ------------------------------------------------------------------ *
   * 9. Section bar
   * ------------------------------------------------------------------ */
  var rail = document.getElementById('rail');
  var tabList = document.getElementById('tabs');
  var railToggle = document.getElementById('railToggle');
  var narrow = window.matchMedia('(max-width: 719px)');

  function setRail(open) {
    rail.classList.toggle('expanded', open);
    railToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  railToggle.addEventListener('click', function () {
    setRail(!rail.classList.contains('expanded'));
  });

  SECTIONS.forEach(function (s, i) {
    var b = document.createElement('button');
    b.className = 'tab';
    b.type = 'button';
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', 'false');
    b.setAttribute('aria-controls', 'panelCard');
    b.setAttribute('aria-label', s.label);
    b.setAttribute('data-id', s.id);
    b.id = 'tab-' + s.id;
    b.title = s.label;
    b.tabIndex = i === 0 ? 0 : -1;
    b.innerHTML = '<svg class="pent" width="15" height="15" viewBox="0 0 100 100" aria-hidden="true">'
      + '<path d="' + PENT_PATH + '"/></svg><span class="tab-label">' + s.label + '</span>';
    b.addEventListener('click', function () { openSection(s.id); });
    tabList.appendChild(b);
  });

  var tabs = Array.prototype.slice.call(tabList.querySelectorAll('.tab'));

  tabList.addEventListener('keydown', function (e) {
    var i = tabs.indexOf(document.activeElement);
    if (i === -1) return;
    var n = null;
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') n = (i + 1) % tabs.length;
    else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') n = (i - 1 + tabs.length) % tabs.length;
    else if (e.key === 'Home') n = 0;
    else if (e.key === 'End') n = tabs.length - 1;
    if (n === null) return;
    e.preventDefault();
    tabs.forEach(function (t, j) { t.tabIndex = j === n ? 0 : -1; });
    tabs[n].focus();
  });

  function markTab(id) {
    tabs.forEach(function (t) {
      var on = t.getAttribute('data-id') === id;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
    });
    if (!id && tabs.length) tabs[0].tabIndex = 0;
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && openId) { e.preventDefault(); closeSection(); }
  });

  /* ------------------------------------------------------------------ *
   * 10. Card
   * ------------------------------------------------------------------ */
  var card = document.getElementById('panelCard');

  function renderCard(s) {
    var html = '<div class="card-head"><div>'
      + '<div class="card-kicker">' + s.kicker + '</div>'
      + '<h2>' + s.heading + '</h2></div>'
      + '<button class="closer" type="button" id="closeCard" aria-label="Leave the ball" '
      + 'title="Leave the ball">' + X_SVG + '</button></div>';
    if (s.intro) html += '<p>' + s.intro + '</p>';

    if (s.entries) {
      html += '<div class="entries">';
      s.entries.forEach(function (en) {
        html += '<div class="entry' + (en.lead ? ' lead' : '') + '">'
          + '<div class="entry-title">' + en.title + '</div>'
          + (en.meta ? '<div class="entry-meta">' + en.meta + '</div>' : '')
          + (en.repo ? '<div class="entry-meta"><a class="repo-link" href="' + en.repoHref
              + '" target="_blank" rel="noopener">' + en.repo + '</a></div>' : '')
          + (en.body ? '<div class="entry-body">' + en.body + '</div>' : '');
        if (en.chips) {
          html += '<div class="chips">' + en.chips.map(function (c) {
            return '<span class="chip">' + c + '</span>';
          }).join('') + '</div>';
        }
        html += '</div>';
      });
      html += '</div>';
    }

    if (s.contacts) {
      html += '<div class="contact-list">';
      s.contacts.forEach(function (c) {
        html += '<div class="contact-row">'
          + '<span class="contact-label">' + c.label + '</span>'
          + '<span class="contact-value">'
          + (c.href ? '<a href="' + c.href + '" target="_blank" rel="noopener">' + c.value + '</a>' : c.value)
          + '</span>'
          + (c.copy ? '<button class="copy-btn" type="button" data-copy="' + c.value + '">Copy</button>' : '')
          + '</div>';
      });
      html += '</div>';
    }

    card.innerHTML = html;
    card.setAttribute('aria-labelledby', 'tab-' + s.id);
    card.scrollTop = 0;
    document.getElementById('closeCard').addEventListener('click', closeSection);

    Array.prototype.forEach.call(card.querySelectorAll('.copy-btn'), function (btn) {
      btn.addEventListener('click', function () {
        var text = btn.getAttribute('data-copy');
        var ok = function () { btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = 'Copy'; }, 1600); };
        var fallback = function () {
          var node = btn.parentNode.querySelector('.contact-value');
          var r = document.createRange();
          r.selectNodeContents(node);
          var sel = window.getSelection();
          sel.removeAllRanges(); sel.addRange(r);
          btn.textContent = 'Selected';
          setTimeout(function () { btn.textContent = 'Copy'; }, 1600);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(ok, fallback);
        } else { fallback(); }
      });
    });

  }

  function showCard() {
    card.classList.add('shown');
    card.focus({ preventScroll: true });
  }
  function hideCard() { card.classList.remove('shown'); }

  /* ------------------------------------------------------------------ *
   * 11. Boot
   * ------------------------------------------------------------------ */
  function boot() {
    if (!window.THREE) { setHint('Use the section bar — 3D unavailable'); return; }
    try { initScene(); }
    catch (err) {
      renderer = null;
      document.querySelector('.ball-layer').hidden = true;
      setHint('Use the section bar — 3D unavailable');
      return;
    }
    if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas);
    window.addEventListener('resize', resize);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) requestRender(); });

    var h = (location.hash || '').replace('#', '');
    if (SECTIONS.some(function (s) { return s.id === h; })) openSection(h);
  }

  boot();
})();
</script>
</body>
</html>
